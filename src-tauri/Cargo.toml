[package]
name = "rust-browser"
version = "0.1.0"
description = "A browser built with Tauri and Rust"
authors = ["Bel-bg"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Requis si vous n'avez pas de custom-protocol défini
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
