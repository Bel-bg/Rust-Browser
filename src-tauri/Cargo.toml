[package]
name = "rust-browser"
version = "0.1.0"
description = "A browser built with Tauri and Rust"
authors = ["Bel-bg"]
edition = "2021"

[lib]
name = "rust_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
